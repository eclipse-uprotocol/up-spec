syntax = "proto3";

package uprotocol.v1;

option java_package = "org.eclipse.uprotocol.v1";
option java_outer_classname = "UUriProto";
option java_multiple_files = true;


// Data model definition for source and destination addressing of messages sent to/from
// devices, services, methods, topics, etc... 
message UUri {
  // The uEntity's deployment location.
  //
  // Could be the host name, ip address, device & domain names, etc..
  string authority_name = 1;

  // The uEntity's type identifier.
  //
  // NOTE
  // Previous revisions of this proto definition defined this field to contain both
  // the type and instance identifiers in a single 32-bit value. Now, the type and instance
  // identifiers are represented separately in `ue_type_id` and `ue_instance_id`.
  // Messages still using the previous 32-bit representation will get rejected by language libraries if they
  // contain an instance ID > 0.
  uint32 ue_type_id = 2;

  // The uEntity's instance identifier.
  uint32 ue_instance_id = 3;

  // The uEntity type's major version number.
  uint32 ue_version_major = 4;

  // The resource id.
  //
  // Identifier used to represent either a method, publish topic, or notification topic.  
  uint32 resource_id = 5;
}


// List of URIs that can be used for batching APIs.
message UUriBatch {
  repeated UUri uris = 1;
}
